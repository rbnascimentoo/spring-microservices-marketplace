spring.application.name=marketplace-config-server
server.port=8888
#spring.cloud.config.server.git.uri=https://github.com/rbnascimentoo/marketplace-configs
#spring.cloud.config.server.git.clone-on-start=true
#spring.cloud.config.server.git.search-paths=config
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.instance.hostname=localhost
eureka.enableself-preservation=false

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true

spring.cloud.config.server.bootstrap=true
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=file:/config
